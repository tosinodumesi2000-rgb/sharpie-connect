<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sharpie Connect - 18+ Dating & Mining</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<style>
body{margin:0;background:#0f111a;color:#fff;font-family:Arial;padding:20px;padding-bottom:100px}
.card{background:#1e1e2f;border-radius:16px;padding:20px;margin-bottom:20px;text-align:center}
.btn{width:100%;padding:14px;border-radius:25px;border:none;font-weight:bold;color:#fff;background:linear-gradient(90deg,#ff007f,#7f00ff);margin-top:10px}
.balance{font-size:32px;color:#ffcc00;font-weight:bold}
.tab{position:fixed;bottom:0;left:0;right:0;background:#1a1a2e;display:flex;justify-content:space-around;padding:12px}
.tab button{background:none;border:none;color:#fff;font-size:14px}
.view{display:none}.view.active{display:block}
</style>
</head>
<body>
<div id="discover" class="view active">
  <div class="card"><h2>Sharpie Connect</h2><p>18+ Only • Consensual Dating & Video Chat</p><p>Anti-Scam Escrow Protected</p></div>
  <div class="card" id="profile-list">Loading verified profiles...</div>
  <div class="card">
    <h3>Book Secure Session</h3>
    <button class="btn" onclick="book('meetup',500)">BOOK MEETUP - 500 Stars (Escrow)</button>
    <button class="btn" style="background:linear-gradient(90deg,#00c6ff,#0072ff)" onclick="book('video',300)">BOOK VIDEO CALL - 300 Stars (Escrow)</button>
  </div>
</div>
<div id="mine" class="view">
  <div class="card">
    <h3>⚡ $SPC Mining Hub</h3>
    <div class="balance" id="coin">0.00 $SPC</div>
    <p id="mine-status">Offline</p>
    <button class="btn" onclick="doMine()">🔋 START MINING + Watch Ad</button>
    <p style="font-size:12px;color:#aaa;margin-top:10px">Watch a Reward ad to earn. 1 ad = 10 $SPC</p>
  </div>
</div>
<div id="wallet" class="view">
  <div class="card"><h3>Wallet</h3><div class="balance" id="stars">1000 Stars</div><p>Escrow Locked: <span id="escrow">0</span> Stars</p></div>
</div>
<div class="tab">
  <button onclick="openTab('discover')">Discover</button>
  <button onclick="openTab('mine')">⚡ Mine</button>
  <button onclick="openTab('wallet')">Wallet</button>
</div>
<div id="ad-banner" style="margin-top:20px"></div>
<script>
const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
const API = "https://sharpie-connect.onrender.com"; // we will create this in Step 3
let AdController;
try{ AdController = window.Adsgram.init({blockId:"48172"}); }catch(e){}

function openTab(name){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(name).classList.add('active');}

async function syncUser(){
  const user = tg.initDataUnsafe.user;
  let res = await fetch(API+"/api/user/sync",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({telegramId:String(user.id),username:user.username})});
  let data = await res.json();
  if(data.success){document.getElementById('stars').innerText=data.data.walletStars+" Stars";document.getElementById('escrow').innerText=data.data.escrowStars+" Stars";document.getElementById('coin').innerText=data.data.coinBalance+" $SPC";}
}
async function doMine(){
  if(AdController){ await AdController.show().catch(()=>{}); }
  let res = await fetch(API+"/api/mine/start",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({telegramId:String(tg.initDataUnsafe.user.id)})});
  let data = await res.json();
  document.getElementById('coin').innerText = data.coinBalance+" $SPC";
  document.getElementById('mine-status').innerText = "Active - 8h";
  tg.showPopup({message:"You earned 10 $SPC!"});
}
async function book(type,cost){
  if(AdController){ await AdController.show().catch(()=>{}); }
  let res = await fetch(API+"/api/escrow/book",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({telegramId:String(tg.initDataUnsafe.user.id),bookingType:type,cost:cost})});
  let data = await res.json();
  tg.showPopup({message:data.message});
  syncUser();
}
syncUser();
</script>
</body>
</html>
