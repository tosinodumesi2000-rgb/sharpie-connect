<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sharpie Connect</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto}
body{background:#0A0A0B;color:#fff;min-height:100vh;display:flex;flex-direction:column}
.header{padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{width:36px;height:36px;background:#D6FF00;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#000;font-weight:900;font-size:18px}
.bal{background:#141417;border:1px solid rgba(255,255,255,.06);border-radius:999px;padding:8px 14px;display:flex;align-items:center;gap:8px}
.bal b{color:#D6FF00}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.coin{width:180px;height:180px;background:radial-gradient(circle at 30% 30%, #2a2a2e, #141417);border:1px solid rgba(214,255,0,.2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:60px;box-shadow:0 0 60px rgba(214,255,0,.15);margin-bottom:20px}
.btn{width:90%;max-width:360px;background:#D6FF00;color:#000;border:none;border-radius:999px;padding:18px;font-size:16px;font-weight:900;letter-spacing:.5px;margin-top:16px}
.btn:disabled{opacity:.5}
.energy{margin-top:16px;background:#141417;border-radius:999px;padding:6px 12px;font-size:12px;display:flex;gap:6px;align-items:center}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#0A0A0B;border-top:1px solid rgba(255,255,255,.06);display:flex;justify-content:space-around;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}
.tab{padding:8px 16px;border-radius:12px;font-size:11px;font-weight:700;color:rgba(255,255,255,.4);border:none;background:transparent}
.tab.active{background:#D6FF00;color:#000}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:80px;background:#1F1F22;border:1px solid rgba(255,255,255,.08);padding:12px 20px;border-radius:999px;font-size:13px;z-index:99;display:none}
</style>
</head>
<body>
<div class="header">
  <div style="display:flex;gap:10px;align-items:center">
    <div class="logo">S</div>
    <div><div style="font-weight:800;font-size:14px">SHARPIEHUB</div><div style="font-size:11px;opacity:.5">Sharpie Connect</div></div>
  </div>
  <div class="bal">💰 <b id="bal">2470</b> $PSC</div>
</div>
<div class="center">
  <div class="coin">🪙</div>
  <h2 style="font-size:28px;font-weight:900;">Mine $PSC</h2>
  <p style="opacity:.5;font-size:13px;margin-top:6px;max-width:280px">Tap mine to watch a short ad and earn. This is how you make money with AdsGram Block 48558</p>
  <button class="btn" id="mineBtn" onclick="mineWithAd()">⚡ MINE +10 $PSC (Watch Ad)</button>
  <div class="energy">⚡ <span id="energy">100</span>/100 Energy • <span id="ads">0</span> ads watched today</div>
  <div style="margin-top:20px;font-size:11px;opacity:.35;">BlockID: 48558 • AdsGram Reward<br>Direct: t.me/SharpieConnectNetBot/Sharpie</div>
</div>
<div class="tabs">
  <button class="tab active">⚡ Mine</button>
  <button class="tab">🎯 Tasks</button>
  <button class="tab">👥 Friends</button>
  <button class="tab">👛 Wallet</button>
</div>
<div class="toast" id="toast"></div>
<script>
try{Telegram.WebApp.ready(); Telegram.WebApp.expand();}catch(e){}
let balance = parseInt(localStorage.getItem('sharpie_bal')||'2470');
let energy = 100;
let adsWatched = parseInt(localStorage.getItem('sharpie_ads')||'0');
document.getElementById('bal').innerText = balance;
document.getElementById('ads').innerText = adsWatched;
function showToast(msg){
  const t=document.getElementById('toast');
  t.innerText=msg; t.style.display='block';
  setTimeout(()=>t.style.display='none',2500);
}
let AdController = null;
try{
  AdController = window.Adsgram.init({ blockId: "48558" });
}catch(e){
  AdController = { show: ()=>new Promise(res=>setTimeout(()=>res({}), 1500)) };
}
async function mineWithAd(){
  if(energy < 8){ showToast("⚡ Low energy, wait 10 sec"); return; }
  const btn=document.getElementById('mineBtn');
  btn.disabled=true;
  btn.innerText="📺 Loading Ad...";
  showToast("📺 Loading reward ad...");
  try{
    const result = await AdController.show();
    balance+=10; energy-=8; adsWatched++;
    localStorage.setItem('sharpie_bal', balance);
    localStorage.setItem('sharpie_ads', adsWatched);
    document.getElementById('bal').innerText = balance;
    document.getElementById('energy').innerText = energy;
    document.getElementById('ads').innerText = adsWatched;
    showToast("+10 $PSC Mined! 🔥");
    btn.innerText="⚡ MINE +10 $PSC (Watch Ad)";
    try{Telegram.WebApp.HapticFeedback.notificationOccurred('success')}catch(e){}
  }catch(err){
    balance+=1; energy-=2;
    localStorage.setItem('sharpie_bal', balance);
    document.getElementById('bal').innerText = balance;
    document.getElementById('energy').innerText = energy;
    showToast("+1 $PSC (ad skipped)");
    btn.innerText="⚡ MINE +10 $PSC (Watch Ad)";
  }finally{ btn.disabled=false; }
}
setInterval(()=>{ if(energy<100){ energy++; document.getElementById('energy').innerText=energy; } },3000);
</script>
</body>
</html>
